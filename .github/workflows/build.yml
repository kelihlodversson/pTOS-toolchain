name: Build SDK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      gcc_version:
        description: 'GCC version to build'
        required: true
        default: latest
        type: choice
        options:
          - latest
          - '12.2.0'
          - '12.3.0'
          - '12.4.0'
          - '12.5.0'
          - '13.1.0'
          - '13.2.0'
          - '13.3.0'
          - '13.4.0'
          - '13.5.0'
          - '14.1.0'
          - '14.2.0'
          - '14.3.0'
          - '14.4.0'
          - '15.1.0'
          - '15.2.0'
          - '15.3.0'
          - '16.2.0'
      binutils_version:
        description: 'Binutils version to build'
        required: true
        default: latest
        type: choice
        options:
          - latest
          - '2.39'
          - '2.40'
          - '2.41'
          - '2.42'
          - '2.43'
          - '2.44'
          - '2.45'

permissions:
  contents: read

# Only PR runs supersede one another; other events keep their own run group.
concurrency:
  group: sdk-build-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect SDK changes
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.changes.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 .github/scripts/sdk_changes.py --event "$GITHUB_EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  host:
    name: Host checks / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check host setup and download failures
        run: /bin/bash tests/host.sh
      - name: Check version selection and CI change filters
        run: |
          python3 tests/test_versions.py
          python3 tests/test_ci_changes.py
          python3 tests/test_m68k_auto_inc_dec.py

  build:
    needs: [changes, host]
    if: needs.changes.outputs.build == 'true'
    name: ${{ matrix.os }} / ${{ matrix.targets }} / GCC ${{ inputs.gcc_version || 'latest' }} / Binutils ${{ inputs.binutils_version || 'latest' }}
    env:
      GCC_VERSION: ${{ inputs.gcc_version || 'latest' }}
      BINUTILS_VERSION: ${{ inputs.binutils_version || 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            targets: m68k
          - os: ubuntu-24.04
            targets: arm
          - os: ubuntu-24.04
            targets: x86_64
          - os: ubuntu-26.04
            targets: m68k
          - os: ubuntu-26.04
            targets: arm
          - os: ubuntu-26.04
            targets: x86_64
          - os: macos-latest
            targets: m68k arm x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Validate requested versions
        run: |
          python3 versions.py gcc "$GCC_VERSION"
          python3 versions.py binutils "$BINUTILS_VERSION"
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          # Keep Ubuntu's signed packages, but avoid relying on the runner's
          # Azure/Canonical mirror endpoints, which can fail DNS resolution.
          printf '%s\tpriority:%s\n' \
            https://mirrors.edge.kernel.org/ubuntu 1 \
            https://archive.ubuntu.com/ubuntu 2 \
            https://security.ubuntu.com/ubuntu 3 \
            | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=3 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=3 install -y build-essential libgmp-dev libmpfr-dev libmpc-dev bison flex m4 xz-utils python3-venv qemu-user
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install make gmp mpfr libmpc python xz
      - name: Check macOS host setup
        if: runner.os == 'macOS'
        run: |
          /bin/bash tests/host.sh
          python3 tests/test_versions.py
          python3 tests/test_ci_changes.py
          python3 tests/test_m68k_auto_inc_dec.py
      - name: Install Python dependencies
        run: |
          python3 -m venv .work/venv
          .work/venv/bin/python -m pip install kconfiglib
          echo "$PWD/.work/venv/bin" >> "$GITHUB_PATH"
      - name: Build toolchain and C SDK
        env:
          JOBS: '3'
          TARGETS: ${{ matrix.targets }}
        run: |
          export PTOS_WORKDIR="$RUNNER_TEMP/ptos-work"
          for arch in $TARGETS; do
            echo "::group::Build and test $arch"
            prefix="$RUNNER_TEMP/ptos/$arch"
            /bin/bash build.sh "$arch" "$prefix" \
              --gcc "$GCC_VERSION" --binutils "$BINUTILS_VERSION"
            /bin/bash tests/smoke.sh "$prefix" "$arch"
            if [[ $arch == m68k && "$RUNNER_OS" == Linux ]]; then
              python3 tests/m68k_auto_inc_dec.py \
                "$prefix/bin/m68k-unknown-ptos-prgelf-gcc" --runner qemu-m68k
            fi
            # Retain the shared source cache, but free each target's build tree.
            rm -rf "$PTOS_WORKDIR/$arch"
            echo "::endgroup::"
          done
