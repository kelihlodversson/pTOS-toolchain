name: Published APT compatibility

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published stable release tag to install
        default: v0.1.0
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/test-apt.yml'
      - '.github/workflows/build.yml'
      - '.github/workflows/release-deb.yml'
      - '.github/workflows/publish-apt.yml'
      - 'packaging/**'
      - 'tests/test_apt.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-apt.yml'
      - '.github/workflows/build.yml'
      - '.github/workflows/release-deb.yml'
      - '.github/workflows/publish-apt.yml'
      - 'packaging/**'
      - 'tests/test_apt.py'

permissions:
  contents: read

jobs:
  install:
    name: Signed APT install / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install all published SDKs and run smoke tests
        env:
          APT_REPOSITORY_URL: https://apt.ptos.dev
          RELEASE_TAG: ${{ inputs.release_tag || 'v0.1.0' }}
        run: bash packaging/test-apt.sh
      - name: Audit installed package dependencies and native ELF symbol requirements
        run: |
          sudo apt-get install -y binutils
          python3 packaging/audit-runtime.py
