name: SDK release packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package_version:
        description: 'Debian version for a test build (no release upload)'
        default: '0.0.0~ci'
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/release-deb.yml'
      - '.github/workflows/publish-apt.yml'
      - '.github/workflows/test-apt.yml'
      - 'tests/test_apt.py'
      - '.github/workflows/homebrew.yml'
      - 'Formula/**'
      - 'lib/ptos_toolchain_formula.rb'
      - 'tests/test_bottles.py'
      - 'tests/test_bottle_activation.py'
      - 'packaging/**'
      - 'tests/test_deb.py'
      - 'versions.json'
      - 'install-libcmini.sh'
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-deb.yml'
      - '.github/workflows/publish-apt.yml'
      - '.github/workflows/test-apt.yml'
      - 'tests/test_apt.py'
      - '.github/workflows/homebrew.yml'
      - 'Formula/**'
      - 'lib/ptos_toolchain_formula.rb'
      - 'tests/test_bottles.py'
      - 'tests/test_bottle_activation.py'
      - 'packaging/**'
      - 'tests/test_deb.py'
      - 'versions.json'
      - 'install-libcmini.sh'

permissions:
  contents: read

concurrency:
  group: sdk-release-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.release.tag_name || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Packaging fixtures / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging test dependencies
        run: |
          printf '%s\tpriority:%s\n' \
            https://mirrors.edge.kernel.org/ubuntu 1 \
            https://archive.ubuntu.com/ubuntu 2 \
            https://security.ubuntu.com/ubuntu 3 | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=3 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=3 install -y dpkg-dev binutils apt-utils gnupg
      - name: Test package assembly and coexistence
        run: |
          python3 tests/test_deb.py
          python3 tests/test_apt.py
          python3 tests/test_bottles.py
          python3 tests/test_bottle_activation.py

  build:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [m68k, arm, x86_64]
    env:
      JOBS: '3'
    steps:
      - uses: actions/checkout@v4
      - name: Resolve package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MANUAL_VERSION: ${{ inputs.package_version }}
        run: |
          if [[ $GITHUB_EVENT_NAME == release ]]; then
            version=$(bash packaging/release-version.sh "$RELEASE_TAG")
          else
            version=$MANUAL_VERSION
          fi
          dpkg --validate-version "$version"
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
          echo "PTOS_WORKDIR=$RUNNER_TEMP/ptos-work" >> "$GITHUB_ENV"
      - name: Install build dependencies
        run: |
          printf '%s\tpriority:%s\n' \
            https://mirrors.edge.kernel.org/ubuntu 1 \
            https://archive.ubuntu.com/ubuntu 2 \
            https://security.ubuntu.com/ubuntu 3 | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=3 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=3 install -y build-essential dpkg-dev \
            libgmp-dev libmpfr-dev libmpc-dev bison flex m4 xz-utils python3-venv
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install kconfiglib==14.1.0
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Build SDK at its installation prefix
        run: |
          prefix=/opt/ptos/${{ matrix.arch }}
          sudo install -d -o "$(id -un)" -g "$(id -gn)" "$prefix"
          ./build.sh '${{ matrix.arch }}' "$prefix"
          ./tests/smoke.sh "$prefix" '${{ matrix.arch }}'
      - name: Assemble Debian package
        run: |
          python3 packaging/package-deb.py '${{ matrix.arch }}' \
            '/opt/ptos/${{ matrix.arch }}' "$PACKAGE_VERSION" dist
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error
          compression-level: 0

  verify:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          merge-multiple: true
          path: dist
      - name: Install all three SDKs on a fresh runner
        run: |
          printf '%s\tpriority:%s\n' \
            https://mirrors.edge.kernel.org/ubuntu 1 \
            https://archive.ubuntu.com/ubuntu 2 \
            https://security.ubuntu.com/ubuntu 3 | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=3 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=3 install -y ./dist/*.deb
      - name: Verify installed SDKs through /usr/bin
        run: |
          for arch in m68k arm x86_64; do
            package=ptos-sdk-${arch//_/-}
            bash "/usr/share/doc/$package/smoke.sh" /usr "$arch"
            case $arch in
              m68k) target=m68k-unknown-ptos-prgelf ;;
              arm) target=arm-unknown-ptos-elf ;;
              x86_64) target=x86_64-unknown-ptos-elfx32 ;;
            esac
            test "$("$target-gcc" -print-sysroot)" = "/opt/ptos/$arch/$target/sysroot"
          done

  bottles:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: test
    uses: ./.github/workflows/homebrew.yml
    with:
      release_tag: ${{ github.event.release.tag_name || '' }}

  publish:
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
    if: github.event_name == 'release'
    needs: [verify, bottles]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: bottles-*
          merge-multiple: true
          path: dist
      - name: Attach tested packages and bottles to the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test "$(find dist -maxdepth 1 -name '*.deb' | wc -l)" -eq 3
          python3 packaging/prepare-bottles.py dist "$GH_REPO" "$RELEASE_TAG"
          (cd dist && sha256sum *.deb *.bottle*.tar.gz *.bottle.json > SHA256SUMS)
          gh release upload "$RELEASE_TAG" dist/*.deb dist/*.bottle*.tar.gz \
            dist/*.bottle.json dist/SHA256SUMS --clobber
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  activate-bottles:
    if: github.event_name == 'release'
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_SHA: ${{ needs.publish.outputs.release_sha }}
      BOTTLE_BRANCH: automation/bottles-${{ github.event.release.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download published metadata and update matching recipes
        run: |
          metadata="$RUNNER_TEMP/bottle-metadata"
          mkdir -p "$metadata"
          gh release download "$RELEASE_TAG" --pattern '*.bottle.json' --dir "$metadata"
          python3 packaging/activate-bottles.py "$metadata" "$GH_REPO" "$RELEASE_TAG" "$RELEASE_SHA"
          git diff --check
      - name: Create or update the activation PR
        id: pr
        run: |
          if git diff --quiet -- Formula; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BOTTLE_BRANCH"
          git add Formula
          git commit -m "Activate Homebrew bottles for $RELEASE_TAG"
          # This release-specific branch is owned by the automation. Lease it
          # before replacing it on a release rerun.
          if git ls-remote --exit-code --heads origin "$BOTTLE_BRANCH"; then
            git fetch origin "$BOTTLE_BRANCH:refs/remotes/origin/$BOTTLE_BRANCH"
          fi
          git push --force-with-lease origin "$BOTTLE_BRANCH"
          body="$RUNNER_TEMP/bottle-pr.md"
          printf 'Activate the tested bottles published in release %s.\n\nThe recipe files still match the release build. Preserve the recorded Cellar restrictions and SHA-256 checksums.\n\nThe Homebrew workflow is dispatched to install the published bottles and run SDK smoke tests and strict linkage checks.\n' "$RELEASE_TAG" > "$body"
          url=$(gh pr list --head "$BOTTLE_BRANCH" --base main --state open --json url --jq '.[0].url // empty')
          if [[ -n $url ]]; then
            gh pr edit "$url" --title "Activate Homebrew bottles for $RELEASE_TAG" --body-file "$body"
          else
            gh pr create --head "$BOTTLE_BRANCH" --base main \
              --title "Activate Homebrew bottles for $RELEASE_TAG" --body-file "$body"
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Verify published bottles on the activation branch
        if: steps.pr.outputs.changed == 'true'
        run: |
          gh workflow run homebrew.yml --ref "$BOTTLE_BRANCH" -f verify_published_bottles=true

  publish-apt:
    if: github.event_name == 'release' && !github.event.release.prerelease && !github.event.release.draft
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
      deployments: read
    uses: ./.github/workflows/publish-apt.yml
    with:
      release_tag: ${{ github.event.release.tag_name }}
    secrets:
      APT_SIGNING_KEY_B64: ${{ secrets.APT_SIGNING_KEY_B64 }}
      APT_SIGNING_KEY_PASSPHRASE: ${{ secrets.APT_SIGNING_KEY_PASSPHRASE }}
