name: Homebrew SDK

on:
  pull_request:
    paths:
      - "Formula/**"
      - "lib/ptos_toolchain_formula.rb"
      - ".github/workflows/homebrew.yml"
  push:
    branches: [main]
    paths:
      - "Formula/**"
      - "lib/ptos_toolchain_formula.rb"
      - ".github/workflows/homebrew.yml"
  workflow_dispatch:
    inputs:
      verify_published_bottles:
        description: Install and test published bottles instead of rebuilding
        default: false
        type: boolean
  workflow_call:
    inputs:
      release_tag:
        description: Release tag used as the bottle download URL (empty for CI builds)
        required: false
        default: ""
        type: string

permissions:
  contents: read

# Only PR runs supersede one another; other events keep their own run group.
concurrency:
  group: sdk-homebrew-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      sdk: ${{ steps.paths.outputs.sdk }}
      convenience: ${{ steps.paths.outputs.convenience }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VERIFY_PUBLISHED: ${{ inputs.verify_published_bottles || false }}
        run: |
          python3 - <<'PYTHON'
          import os, subprocess
          sdk_paths = {'Formula/ptos-arm.rb', 'Formula/ptos-m68k.rb',
                       'Formula/ptos-x86_64.rb', 'lib/ptos_toolchain_formula.rb'}
          event, base = os.environ['GITHUB_EVENT_NAME'], os.environ.get('BASE_SHA', '')
          if event in ('release', 'workflow_dispatch') or not base or set(base) == {'0'}:
              sdk = True
              convenience = event == 'workflow_dispatch' and os.environ['VERIFY_PUBLISHED'] == 'true'
          else:
              refs = [base + '...' + os.environ['HEAD_SHA']] if event == 'pull_request' else [base, os.environ['HEAD_SHA']]
              paths = set(subprocess.check_output(['git', 'diff', '--name-only', *refs], text=True).splitlines())
              sdk = bool(paths & (sdk_paths | {'.github/workflows/homebrew.yml'}))
              convenience = not bool(paths & sdk_paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'sdk={str(sdk).lower()}', file=output)
              print(f'convenience={str(convenience).lower()}', file=output)
          PYTHON
  install:
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    runs-on: macos-latest
    name: ${{ inputs.verify_published_bottles && 'Verify published Homebrew bottles' || 'Build and test all Homebrew bottles' }}
    timeout-minutes: 240
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_MAKE_JOBS: "3"
      FORMULAE: "ptos-m68k ptos-arm ptos-x86_64"
    steps:
      - uses: actions/checkout@v4
      - name: Register checkout as a development tap
        run: |
          brew tap kelihlodversson/ptos-toolchain "$GITHUB_WORKSPACE"
          if brew command trust >/dev/null 2>&1; then
            for formula in $FORMULAE; do
              brew trust --formula "kelihlodversson/ptos-toolchain/$formula"
            done
          fi
      - name: Check macOS host setup
        run: |
          brew install make
          /bin/bash tests/host.sh
          python3 tests/test_versions.py
          python3 tests/test_ci_changes.py
      - name: Install and test SDKs
        env:
          VERIFY_PUBLISHED: ${{ inputs.verify_published_bottles || false }}
        run: |
          for formula in $FORMULAE; do
            echo "::group::Build and test $formula"
            full_name="kelihlodversson/ptos-toolchain/$formula"
            brew style "$full_name"
            if [[ $VERIFY_PUBLISHED == true ]]; then
              brew install --force-bottle --verbose "$full_name"
              brew info --json=v2 "$full_name" |
                jq -e '.formulae[0].installed | length == 1 and .[0].poured_from_bottle == true'
            else
              brew install --build-bottle --verbose "$full_name"
            fi
            brew test "$full_name"
            brew linkage --test --strict "$full_name"
            echo "::endgroup::"
          done
      - name: Build bottle and checksum metadata
        if: ${{ !inputs.verify_published_bottles }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir bottles
          cd bottles
          args=(--json)
          if [[ -n $RELEASE_TAG ]]; then
            tag=$(jq -rn --arg tag "$RELEASE_TAG" '$tag | @uri')
            args+=(--root-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag")
          fi
          for formula in $FORMULAE; do
            brew bottle "${args[@]}" "kelihlodversson/ptos-toolchain/$formula"
          done
      - name: Reinstall from bottle
        if: ${{ !inputs.verify_published_bottles }}
        shell: bash
        env:
          # Homebrew 7 requires developer mode to install our locally built bottle.
          HOMEBREW_DEVELOPER: "1"
        run: |
          shopt -s nullglob
          bottles=(bottles/*.bottle*.tar.gz)
          test "${#bottles[@]}" -eq 3
          for formula in $FORMULAE; do
            brew uninstall "kelihlodversson/ptos-toolchain/$formula"
          done
          # Homebrew 7 revokes per-formula trust when uninstalling.
          if brew command trust >/dev/null 2>&1; then
            for formula in $FORMULAE; do
              brew trust --formula "kelihlodversson/ptos-toolchain/$formula"
            done
          fi
          for bottle in "${bottles[@]}"; do
            brew install --force-bottle "$GITHUB_WORKSPACE/$bottle"
          done
          for formula in $FORMULAE; do
            brew info --json=v2 "kelihlodversson/ptos-toolchain/$formula" |
              jq -e '.formulae[0].installed | length == 1 and .[0].poured_from_bottle == true'
          done
      - name: Test bottled SDK
        run: |
          for formula in $FORMULAE; do
            brew test "kelihlodversson/ptos-toolchain/$formula"
            brew linkage --test --strict "kelihlodversson/ptos-toolchain/$formula"
          done
      - name: Test all-target selection against the tested SDK bottles
        run: |
          if brew command trust >/dev/null 2>&1; then
            brew trust --formula kelihlodversson/ptos-toolchain/ptos-toolchain
          fi
          brew install kelihlodversson/ptos-toolchain/ptos-toolchain
          brew test kelihlodversson/ptos-toolchain/ptos-toolchain
      - name: Upload tested bottle
        if: ${{ !inputs.verify_published_bottles }}
        uses: actions/upload-artifact@v4
        with:
          name: bottles-${{ runner.os }}-${{ runner.arch }}
          path: |
            bottles/*.bottle*.tar.gz
            bottles/*.bottle.json
          if-no-files-found: error
          retention-days: 14

  toolchain:
    needs: changes
    if: needs.changes.outputs.convenience == 'true'
    name: Install all-target formula with published SDK bottles
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_BOTTLE_SOURCE_FALLBACK: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Register and trust the checkout tap
        run: |
          brew tap kelihlodversson/ptos-toolchain "$GITHUB_WORKSPACE"
          if brew command trust >/dev/null 2>&1; then
            for formula in ptos-toolchain ptos-m68k ptos-arm ptos-x86_64; do
              brew trust --formula "kelihlodversson/ptos-toolchain/$formula"
            done
          fi
      - name: Audit formula and runtime dependencies
        shell: bash
        run: |
          formula=kelihlodversson/ptos-toolchain/ptos-toolchain
          brew style "$formula"
          brew audit --strict "$formula"
          brew deps --direct "$formula" | sort > "$RUNNER_TEMP/actual-deps"
          printf '%s\n' kelihlodversson/ptos-toolchain/ptos-arm \
            kelihlodversson/ptos-toolchain/ptos-m68k \
            kelihlodversson/ptos-toolchain/ptos-x86_64 | sort > "$RUNNER_TEMP/expected-deps"
          diff -u "$RUNNER_TEMP/expected-deps" "$RUNNER_TEMP/actual-deps"
      - name: Install only the convenience formula on a clean runner
        run: brew install --verbose kelihlodversson/ptos-toolchain/ptos-toolchain
      - name: Verify dependency bottles, short-name resolution and compiler smoke tests
        shell: bash
        run: |
          for formula in ptos-m68k ptos-arm ptos-x86_64; do
            brew info --json=v2 "kelihlodversson/ptos-toolchain/$formula" |
              jq -e '.formulae[0].installed | length == 1 and .[0].poured_from_bottle == true'
            brew test "kelihlodversson/ptos-toolchain/$formula"
            brew linkage --test --strict "kelihlodversson/ptos-toolchain/$formula"
          done
          brew info --json=v2 ptos-toolchain |
            jq -e '.formulae[0].full_name == "kelihlodversson/ptos-toolchain/ptos-toolchain"'
          brew test kelihlodversson/ptos-toolchain/ptos-toolchain
