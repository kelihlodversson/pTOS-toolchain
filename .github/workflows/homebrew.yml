name: Homebrew SDK

on:
  pull_request:
    paths:
      - "Formula/**"
      - "lib/ptos_toolchain_formula.rb"
      - ".github/workflows/homebrew.yml"
  push:
    branches: [main]
    paths:
      - "Formula/**"
      - "lib/ptos_toolchain_formula.rb"
      - ".github/workflows/homebrew.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        formula: [ptos-m68k, ptos-arm, ptos-x86_64]
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_MAKE_JOBS: "3"
    steps:
      - uses: actions/checkout@v4
      - name: Register checkout as a development tap
        run: |
          brew tap kelihlodversson/ptos-ci "$GITHUB_WORKSPACE"
          if brew command trust >/dev/null 2>&1; then
            brew trust --formula "kelihlodversson/ptos-ci/${{ matrix.formula }}"
          fi
      - name: Check formula style
        run: brew style "kelihlodversson/ptos-ci/${{ matrix.formula }}"
      - name: Install from source
        run: brew install --build-bottle --verbose "kelihlodversson/ptos-ci/${{ matrix.formula }}"
      - name: Test installed SDK
        run: brew test "kelihlodversson/ptos-ci/${{ matrix.formula }}"
      - name: Check linking
        run: brew linkage --test --strict "kelihlodversson/ptos-ci/${{ matrix.formula }}"
      - name: Build bottle and checksum metadata
        run: |
          mkdir bottles
          cd bottles
          brew bottle --json "kelihlodversson/ptos-ci/${{ matrix.formula }}"
      - name: Reinstall from bottle
        shell: bash
        run: |
          shopt -s nullglob
          bottles=(bottles/*.bottle*.tar.gz)
          test "${#bottles[@]}" -eq 1
          brew uninstall "kelihlodversson/ptos-ci/${{ matrix.formula }}"
          brew install --force-bottle "${bottles[0]}"
          brew info --json=v2 "kelihlodversson/ptos-ci/${{ matrix.formula }}" |
            jq -e '.formulae[0].installed | length == 1 and .[0].poured_from_bottle == true'
      - name: Test bottled SDK
        run: |
          brew test "kelihlodversson/ptos-ci/${{ matrix.formula }}"
          brew linkage --test --strict "kelihlodversson/ptos-ci/${{ matrix.formula }}"
      - name: Upload tested bottle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.formula }}-${{ runner.os }}-${{ runner.arch }}-bottle
          path: |
            bottles/*.bottle*.tar.gz
            bottles/*.bottle.json
          if-no-files-found: error
          retention-days: 14
